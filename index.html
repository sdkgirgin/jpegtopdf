<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dosya Takip</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dosya Takip">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  html{-webkit-text-size-adjust:100%;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
</style>
<style>
  :root{
    --navy:#1E3A5F;
    --navy-deep:#132840;
    --red:#C0392B;
    --cream:#F7F5F1;
    --paper:#FFFFFF;
    --ink:#20303F;
    --slate:#6B7A8D;
    --line:#E4E1D8;
    --green:#3A7D5C;
    --amber:#B8791A;
    --danger:#C0392B;
    font-family:Inter,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
  }
  .app{max-width:760px;margin:0 auto;padding:20px 16px 80px;}

  /* HEADER */
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;background:var(--navy);border-radius:14px;
    margin-bottom:18px;color:#fff;
    box-shadow:0 4px 14px rgba(19,40,64,0.18);
  }
  header.top .brand{display:flex;flex-direction:column;gap:2px;}
  header.top .brand .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9FB3C8;font-weight:600;}
  header.top .brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;}
  .add-btn{
    background:var(--red);color:#fff;border:none;border-radius:9px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:transform .12s, background .12s;
  }
  .add-btn:hover{background:#a8352a;transform:translateY(-1px);}

  /* STATS STRIP */
  .stats{display:flex;gap:10px;margin-bottom:16px;}
  .stat{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 14px;}
  .stat .num{font-size:22px;font-weight:700;color:var(--navy);line-height:1;}
  .stat .lbl{font-size:11.5px;color:var(--slate);margin-top:4px;font-weight:500;}

  /* CONTROLS */
  .controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .search{
    flex:1;min-width:160px;padding:10px 13px;border:1px solid var(--line);
    border-radius:9px;font-size:14px;background:var(--paper);color:var(--ink);
  }
  .search:focus{outline:none;border-color:var(--navy);}
  .tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:3px;}
  .tab{
    border:none;background:transparent;padding:7px 12px;border-radius:7px;
    font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;white-space:nowrap;
  }
  .tab.active{background:var(--navy);color:#fff;}

  /* TASK LIST */
  .task{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    margin-bottom:10px;overflow:hidden;transition:box-shadow .15s;
  }
  .task:hover{box-shadow:0 3px 10px rgba(30,58,95,0.08);}
  .task-head{
    display:flex;align-items:flex-start;gap:12px;padding:14px 15px;cursor:pointer;
  }
  .check-dot{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--line);
    flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .check-dot.done{background:var(--green);border-color:var(--green);}
  .check-dot.done::after{content:"✓";color:#fff;font-size:12px;font-weight:700;}
  .task-body-txt{flex:1;min-width:0;}
  .task-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .task-title{font-size:15px;font-weight:600;color:var(--ink);}
  .task.done .task-title{color:var(--slate);text-decoration:line-through;text-decoration-color:var(--line);}
  .tag{
    font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
    text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
  }
  .tag.cat{background:#EDF1F5;color:var(--navy);}
  .tag.status-devam{background:#FDF1E7;color:var(--amber);}
  .tag.status-tamam{background:#E9F4EE;color:var(--green);}
  .tag.status-bekliyor{background:#FBEAE8;color:var(--red);}
  .last-line{font-size:12.5px;color:var(--slate);margin-top:5px;display:flex;gap:5px;align-items:baseline;}
  .last-line .who{color:var(--navy);font-weight:600;}
  .chev{color:var(--slate);font-size:13px;transition:transform .18s;margin-top:4px;flex-shrink:0;}
  .task.open .chev{transform:rotate(90deg);}

  /* EXPANDED DETAIL */
  .detail{display:none;border-top:1px solid var(--line);background:#FBFAF7;padding:14px 15px 16px 15px;}
  .task.open .detail{display:block;}
  .next-box{
    background:#FDF6EC;border:1px solid #F1DFC0;border-radius:9px;padding:10px 12px;margin-bottom:14px;
    font-size:13px;color:#7A5417;
  }
  .next-box b{color:#5B3E0F;}
  .timeline{list-style:none;margin:0 0 14px 0;padding:0;border-left:2px solid var(--line);margin-left:6px;}
  .timeline li{position:relative;padding:0 0 14px 18px;}
  .timeline li:last-child{padding-bottom:0;}
  .timeline li::before{
    content:"";position:absolute;left:-6.5px;top:3px;width:11px;height:11px;
    border-radius:50%;background:var(--navy);border:2px solid #FBFAF7;
  }
  .timeline li.latest::before{background:var(--red);}
  .t-date{font-size:11px;color:var(--slate);font-weight:600;margin-bottom:2px;}
  .t-text{font-size:13.5px;color:var(--ink);line-height:1.45;white-space:pre-wrap;}
  .empty-log{font-size:13px;color:var(--slate);font-style:italic;margin-bottom:14px;}

  .note-form{display:flex;flex-direction:column;gap:8px;}
  .note-form textarea{
    resize:vertical;min-height:56px;border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;font-size:13.5px;font-family:inherit;color:var(--ink);
  }
  .note-form textarea:focus{outline:none;border-color:var(--navy);}
  .note-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .note-row button.primary{
    background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 14px;
    font-size:13px;font-weight:600;cursor:pointer;
  }
  .note-row button.primary:hover{background:var(--navy-deep);}
  .status-select{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;
    color:var(--ink);background:#fff;
  }
  .row-actions{margin-left:auto;display:flex;gap:10px;}
  .link-btn{background:none;border:none;color:var(--slate);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .link-btn.danger{color:var(--danger);}

  /* EMPTY STATE */
  .empty-state{text-align:center;padding:50px 20px;color:var(--slate);}
  .empty-state .big{font-size:34px;margin-bottom:8px;}
  .empty-state p{font-size:14px;margin:4px 0;}

  /* MODAL */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(19,40,64,0.45);
    align-items:center;justify-content:center;padding:16px;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:14px;padding:20px;max-width:420px;width:100%;
    box-shadow:0 14px 40px rgba(0,0,0,0.2);
  }
  .modal h2{margin:0 0 14px;font-size:16px;color:var(--navy);}
  .modal label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin:12px 0 5px;}
  .modal input, .modal select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink);
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn-plain{background:#EEEDE7;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
  .btn-red{background:var(--red);border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;}

  .loading-note{text-align:center;color:var(--slate);font-size:13px;padding:30px;}
  footer.reset{text-align:center;margin-top:26px;}
  footer.reset button{background:none;border:none;color:var(--slate);font-size:11.5px;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Startkey Platin</span>
      <h1>Dosya Takip</h1>
    </div>
    <button class="add-btn" onclick="openModal()">+ Yeni İşlem</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input class="search" id="search" placeholder="İşlem ara..." oninput="render()">
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="list"><div class="loading-note">Yükleniyor...</div></div>

  <footer class="reset">
    <button onclick="resetAll()">Tüm verileri sıfırla</button>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Yeni İşlem Kaydet</h2>
    <label>Başlık</label>
    <input id="m-title" placeholder="Örn: Muradiye OSB - Ahmet Bey arsa satışı">
    <label>Kategori</label>
    <select id="m-cat">
      <option>Satış</option>
      <option>Kiralama</option>
      <option>Tapu İşlemi</option>
      <option>Ticari / OSB</option>
      <option>Sözleşme</option>
      <option>Diğer</option>
    </select>
    <label>İlk not (opsiyonel — ne yaptın / ilk adım ne?)</label>
    <input id="m-note" placeholder="Örn: Müşteriyle ilk görüşme yapıldı">
    <div class="modal-actions">
      <button class="btn-plain" onclick="closeModal()">Vazgeç</button>
      <button class="btn-red" onclick="createTask()">Kaydet</button>
    </div>
  </div>
</div>

<script>
let tasks = [];
let filterTab = 'all';
let openId = null;

const STORAGE_KEY = 'tasks-data';

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    tasks = raw ? JSON.parse(raw) : [];
  }catch(e){
    tasks = [];
  }
  render();
}

async function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }catch(e){
    console.error('Kaydetme hatası', e);
  }
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}) + ' · ' +
         d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
function fmtRelative(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const h = diff/3600000;
  if(h < 1) return 'az önce';
  if(h < 24) return Math.floor(h)+' saat önce';
  const d = Math.floor(h/24);
  if(d < 7) return d+' gün önce';
  return fmtDate(iso);
}

function openModal(){
  document.getElementById('overlay').classList.add('show');
  document.getElementById('m-title').focus();
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('m-title').value='';
  document.getElementById('m-note').value='';
}

async function createTask(){
  const title = document.getElementById('m-title').value.trim();
  if(!title) return;
  const cat = document.getElementById('m-cat').value;
  const noteText = document.getElementById('m-note').value.trim();
  const now = new Date().toISOString();
  const task = {
    id: uid(), title, category: cat, status: 'devam',
    createdAt: now, updatedAt: now,
    logs: noteText ? [{id:uid(), timestamp:now, text:noteText}] : []
  };
  tasks.unshift(task);
  await save();
  closeModal();
  openId = task.id;
  render();
}

async function toggleDone(id, ev){
  ev.stopPropagation();
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = t.status === 'tamam' ? 'devam' : 'tamam';
  t.updatedAt = new Date().toISOString();
  await save();
  render();
}

function toggleOpen(id){
  openId = openId === id ? null : id;
  render();
}

async function setStatus(id, val, ev){
  if(ev) ev.stopPropagation();
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = val;
  t.updatedAt = new Date().toISOString();
  await save();
  render();
}

async function addNote(id){
  const ta = document.getElementById('note-input-'+id);
  const text = ta.value.trim();
  if(!text) return;
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const now = new Date().toISOString();
  t.logs.push({id:uid(), timestamp:now, text});
  t.updatedAt = now;
  await save();
  render();
}

async function deleteTask(id, ev){
  ev.stopPropagation();
  if(!confirm('Bu işlem silinsin mi? Bu geri alınamaz.')) return;
  tasks = tasks.filter(x=>x.id!==id);
  await save();
  render();
}

async function resetAll(){
  if(!confirm('Tüm kayıtlı işlemler silinecek. Emin misin?')) return;
  tasks = [];
  await save();
  render();
}

function statusLabel(s){
  return s==='tamam' ? 'Tamamlandı' : s==='bekliyor' ? 'Beklemede' : 'Devam Ediyor';
}
function statusClass(s){
  return s==='tamam' ? 'status-tamam' : s==='bekliyor' ? 'status-bekliyor' : 'status-devam';
}

function render(){
  const list = document.getElementById('list');
  const q = document.getElementById('search').value.toLowerCase();

  // stats
  const total = tasks.length;
  const devam = tasks.filter(t=>t.status==='devam').length;
  const bekliyor = tasks.filter(t=>t.status==='bekliyor').length;
  const tamam = tasks.filter(t=>t.status==='tamam').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Toplam Dosya</div></div>
    <div class="stat"><div class="num">${devam}</div><div class="lbl">Devam Eden</div></div>
    <div class="stat"><div class="num">${bekliyor}</div><div class="lbl">Beklemede</div></div>
    <div class="stat"><div class="num">${tamam}</div><div class="lbl">Tamamlanan</div></div>
  `;

  // tabs
  const tabDefs = [['all','Tümü'],['devam','Devam Eden'],['bekliyor','Beklemede'],['tamam','Tamamlanan']];
  document.getElementById('tabs').innerHTML = tabDefs.map(([k,l])=>
    `<button class="tab ${filterTab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`
  ).join('');

  let filtered = tasks.filter(t=>{
    if(filterTab!=='all' && t.status!==filterTab) return false;
    if(q && !t.title.toLowerCase().includes(q) && !t.category.toLowerCase().includes(q)) return false;
    return true;
  });

  // sort: open item context aside, otherwise by updatedAt desc
  filtered.sort((a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt));

  if(filtered.length===0){
    list.innerHTML = `<div class="empty-state">
      <div class="big">📋</div>
      <p><b>${tasks.length===0 ? 'Henüz işlem yok' : 'Sonuç bulunamadı'}</b></p>
      <p>${tasks.length===0 ? '"+ Yeni İşlem" ile ilk dosyanı aç.' : 'Farklı bir arama veya filtre dene.'}</p>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(t=>{
    const isOpen = openId === t.id;
    const lastLog = t.logs[t.logs.length-1];
    const logsHtml = t.logs.length ? t.logs.slice().reverse().map((log,i)=>`
      <li class="${i===0?'latest':''}">
        <div class="t-date">${fmtDate(log.timestamp)}</div>
        <div class="t-text">${escapeHtml(log.text)}</div>
      </li>`).join('') : '';
    return `
    <div class="task ${t.status==='tamam'?'done':''} ${isOpen?'open':''}">
      <div class="task-head" onclick="toggleOpen('${t.id}')">
        <div class="check-dot ${t.status==='tamam'?'done':''}" onclick="toggleDone('${t.id}', event)"></div>
        <div class="task-body-txt">
          <div class="task-title-row">
            <span class="task-title">${escapeHtml(t.title)}</span>
            <span class="tag cat">${t.category}</span>
            <span class="tag ${statusClass(t.status)}">${statusLabel(t.status)}</span>
          </div>
          <div class="last-line">
            ${lastLog
              ? `<span>${fmtRelative(t.updatedAt)} · ${escapeHtml(truncate(lastLog.text,70))}</span>`
              : `<span style="font-style:italic;color:var(--slate)">Henüz not girilmedi</span>`}
          </div>
        </div>
        <div class="chev">▶</div>
      </div>
      <div class="detail">
        ${lastLog ? `<div class="next-box"><b>Son durum:</b> ${escapeHtml(lastLog.text)}</div>` : ''}
        ${t.logs.length ? `<ul class="timeline">${logsHtml}</ul>` : `<div class="empty-log">Bu dosya için henüz kayıt yok. İlk notu aşağıdan ekle.</div>`}
        <div class="note-form">
          <textarea id="note-input-${t.id}" placeholder="Şimdi ne yaptın ya da sırada ne var? Not düş..."></textarea>
          <div class="note-row">
            <select class="status-select" onchange="setStatus('${t.id}', this.value, event)">
              <option value="devam" ${t.status==='devam'?'selected':''}>Devam Ediyor</option>
              <option value="bekliyor" ${t.status==='bekliyor'?'selected':''}>Beklemede</option>
              <option value="tamam" ${t.status==='tamam'?'selected':''}>Tamamlandı</option>
            </select>
            <button class="primary" onclick="addNote('${t.id}')">Not Ekle</button>
            <div class="row-actions">
              <button class="link-btn danger" onclick="deleteTask('${t.id}', event)">Sil</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function setTab(k){filterTab=k; render();}
function truncate(s,n){return s.length>n ? s.slice(0,n)+'…' : s;}
function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeModal();
});

load();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
